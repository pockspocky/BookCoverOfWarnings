services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bow
      POSTGRES_DB: bow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5433:5432"
    volumes:
      - bow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bow -d bow"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bow
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bow_minio:/data

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:3001
      SCHOOL_EMAIL_DOMAIN: waprep.org
      COOKIE_SECURE: "false"
      SESSION_TTL_HOURS: 12
      SUBMISSION_RATE_LIMIT: 30
      SUBMISSION_RATE_WINDOW_SECONDS: 3600
      SEARCH_RATE_LIMIT: 60
      SEARCH_RATE_WINDOW_SECONDS: 60
      MAX_UPLOAD_BYTES: 10000000
      ALLOWED_UPLOAD_TYPES: application/pdf,image/png,image/jpeg,text/plain
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: bow-attachments
      S3_ACCESS_KEY: bow
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: "true"
      IDENTITY_PROVIDER: unconfigured
      OIDC_ISSUER: ""
      OIDC_CLIENT_ID: ""
    secrets:
      - database_url
      - s3_secret_key
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_password:
    file: ./secrets/minio_root_password
  database_url:
    file: ./secrets/database_url
  s3_secret_key:
    file: ./secrets/s3_secret_key

volumes:
  bow_pg:
  bow_minio:
